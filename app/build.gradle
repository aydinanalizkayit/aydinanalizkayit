plugins {
    id 'com.android.application'
}

android {
    namespace 'com.canlinavigasyon.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.canlinavigasyon.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

configurations.all {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.jetbrains.kotlin') {
            useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
